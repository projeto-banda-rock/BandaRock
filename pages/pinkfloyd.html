<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pink Floyd - Experience</title>
  <link rel="stylesheet" href="/style/pinkfloyd.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Camada de Chuva de Discos -->
  <div id="vinyl-rain-container"></div>

  <!-- Efeito de Textura no Fundo -->
  <div class="grain-overlay"></div>

  <!-- Conteúdo Principal -->
  <main class="hero-container">
    <div class="prism-light"></div>
    <h1 class="band-title">PINK FLOYD</h1>
    <p class="album-subtitle">The Dark Side of the Moon</p>

    <!-- Botões para disparar os dois modais -->
    <div class="btn-group">
      <button id="open-album-btn" class="glow-btn">EXPLORAR ÁLBUM</button>
      <button id="open-history-btn" class="glow-btn outline">HISTÓRIA DA BANDA</button>
    </div>
  </main>


  <script src="/script/pinkfloyd.js"></script>
</body>
</html>
